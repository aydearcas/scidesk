# Continuous integration (record 0081): every push and pull request is type-checked, built and
# tested on a clean Windows and a clean macOS machine, the editor in Chromium and WebKit. The same
# steps run locally with `npm run ci` (the editor only in Chromium: the Edge already installed).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # every day too, so that a new WebKit or Chromium that breaks the editor shows up (R37)
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Tauri's build script needs the built window (frontendDist) to compile the Rust crate.
      - name: Build the window
        run: npm run build -w @scidesk/desktop

      # The core's PDF and SVG tests use this binary when it is there (record 0040, 0068).
      - name: Build scidesk-pdf
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin scidesk-pdf

      - name: Test (npm)
        run: npm test

      - name: Test (Rust)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # The editor in Chromium and WebKit (R37, record 0082), the browser view with Tauri simulated
      - name: Install the browsers
        run: npx playwright install chromium webkit

      - name: Test the editor (Chromium, WebKit)
        run: npm run e2e -w @scidesk/desktop

      - name: Keep the editor report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report/
          retention-days: 14
