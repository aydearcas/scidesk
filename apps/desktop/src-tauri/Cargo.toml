[package]
name = "scidesk"
version = "0.1.0"
description = "SciDesk: desktop word processor for scientific articles"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "scidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
