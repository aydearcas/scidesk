[package]
name = "scidesk"
version = "0.1.0"
description = "SciDesk: desktop word processor for scientific articles"
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "scidesk"

[lib]
name = "scidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
base64 = "0.22"
# PDF with Typst as a library (records 0024 and 0040), Apache-2.0
typst = "0.15"
typst-kit = { version = "0.15", features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
typst-render = "0.15"
typst-utils = "0.15"

[dev-dependencies]
tempfile = "3"
